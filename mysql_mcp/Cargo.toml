[package]
name = "mysql_mcp"
version = "1.0.0"
repository = "https://github.com/matpb/mysql-mcp-rs"
readme = "README.md"
keywords = ["mcp", "mysql", "database", "read-only", "ai"]
categories = ["database", "command-line-utilities"]
description = "A lightweight Rust MCP server for read-only MySQL access with multi-database support"
edition.workspace = true
license.workspace = true
authors.workspace = true

#[features]
#http = ["rmcp/transport-streamable-http-server", "dep:axum", "dep:tower-http", "dep:http"]

[dependencies]
anyhow.workspace = true
chrono = "0.4.44"
regex = "1"
rmcp = { workspace = true, features = ["server", "macros"] }
rust_decimal = "1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["mysql", "runtime-tokio", "tls-rustls", "chrono", "rust_decimal"] }
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }